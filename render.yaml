services:
  - type: web
    name: fact-knowledge-layer
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_API_KEYS
        sync: false
